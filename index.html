<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>회전베어링 카탈로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b6b74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="베어링 검색">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: sticky search rail on top; results column + page viewer side by side on wide screens, viewer as full-screen sheet on phones */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunk:#f6f8f9; --ink:#14202b; --muted:#5a6876; --line:#d5dce2;
  --accent:#0b6b74; --accent-ink:#ffffff; --accent-soft:#dcefef; --mark:#ffd34d66; --hl:#ffcf2e; --warn:#9a5b00; --warn-soft:#fff2d6;
  --ok:#1d7a46; --bad:#b3261e;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1317; --surface:#151c22; --sunk:#10161b; --ink:#e4eaee; --muted:#93a1ad; --line:#26323b;
  --accent:#4fb8c1; --accent-ink:#06191b; --accent-soft:#163a3e; --mark:#ffcc3340; --hl:#ffcf2e; --warn:#f0b45a; --warn-soft:#3a2a10;
  --ok:#5cc98a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1317; --surface:#151c22; --sunk:#10161b; --ink:#e4eaee; --muted:#93a1ad; --line:#26323b;
  --accent:#4fb8c1; --accent-ink:#06191b; --accent-soft:#163a3e; --mark:#ffcc3340; --hl:#ffcf2e; --warn:#f0b45a; --warn-soft:#3a2a10;
  --ok:#5cc98a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{grid-template-columns:minmax(0,1fr);max-width:1280px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.tabs button{border:0;background:none;border-radius:4px;padding:4px 12px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.qrow{display:flex;gap:8px;flex-wrap:wrap}
.qbox{flex:1 1 260px;min-width:0;position:relative}
#q{width:100%;height:46px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:0 40px 0 14px;font-size:16px}
#q:focus{border-color:var(--accent);outline:none;background:var(--surface)}
#clear{position:absolute;right:6px;top:7px;width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;border-radius:4px}
@media (max-width:600px){#cat{flex-basis:100%!important;width:100%}}
#cat{height:46px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:0 10px;max-width:100%;flex:0 1 220px;min-width:0}

main{grid-template-columns:minmax(0,1fr);max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
@media (min-width:980px){main.has-view{grid-template-columns:minmax(0,460px) minmax(0,1fr);align-items:start}}
#results,#calc{min-width:0;display:grid;gap:18px;align-content:start}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.sec-h b{color:var(--ink);font-family:var(--f-mono);letter-spacing:0;font-size:13px}
.list{display:grid;gap:8px}
.grp{font-size:12px;color:var(--muted);margin:10px 0 2px;font-weight:500}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;min-width:0}
.item:hover{border-color:var(--accent)}
.item.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lab{font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--accent)}
.cat{font-size:12px;color:var(--muted)}
.crumb{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows{margin-top:6px;overflow-x:auto;background:var(--sunk);border-radius:4px;padding:6px 8px}
.rows div{font-family:var(--f-mono);font-size:12px;white-space:pre;line-height:1.6}
.snip{margin-top:6px;font-size:13px;color:var(--ink);display:grid;gap:2px}
.snip div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.mono{font-size:12.5px}
.empty{display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h2{margin:0 0 10px;font-size:14px}
.catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px}
.catlist button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:5px 0;text-align:left;border-bottom:1px dashed var(--line);font-size:13px;min-width:0}
.catlist button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catlist button span:last-child{color:var(--muted);font-family:var(--f-mono);font-size:12px;flex:none}
.catlist button:hover span:first-child{color:var(--accent)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* spec answer */
.ans{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ans-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.ans-h strong{font-size:15px}
.ans-h span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-size:13px}
table.st th,table.st td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.st th{font-size:11.5px;font-weight:500;color:var(--muted);background:var(--sunk)}
table.st td.v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
table.st td.v.big{font-weight:500;color:var(--ink)}
table.st tr.cg td{background:var(--sunk);font-size:11.5px;color:var(--muted);font-weight:500;padding:5px 10px}
table.st tr.r{cursor:pointer}
table.st tr.r:hover td{background:var(--accent-soft)}
table.st tr.r.on td{background:var(--accent-soft)}
table.st td.m{font-family:var(--f-mono);font-weight:500;color:var(--accent)}
table.st td.pg{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
table.st td{vertical-align:top}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--sunk);padding:8px;font-size:13px;color:var(--accent)}

/* viewer */
#viewer{min-width:0}
#viewer[hidden]{display:none!important}
@media (min-width:980px){#viewer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px)}#vback{display:none}}
@media (max-width:979px){
  #viewer{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body.viewing{overflow:hidden}
}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:980px){.vcard{max-height:calc(100vh - 150px);overflow-y:auto}}
@media (max-width:979px){.vcard{border:0;border-radius:0;min-height:100%}}
.vhead{padding:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:grid;gap:6px;position:sticky;top:0;background:var(--surface);z-index:2}
.vtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#vback{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);height:34px;padding:0 12px;font-size:14px}
.vlab{font-family:var(--f-mono);font-size:20px;font-weight:500;color:var(--accent)}
.vpdf{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.vcat{font-size:13px;font-weight:500}
.vcrumb{font-size:12px;color:var(--muted)}
.vnav{display:flex;gap:6px;flex-wrap:wrap}
.vnav button{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);height:32px;padding:0 10px;font-size:13px}
.vnav button:disabled{opacity:.4;cursor:default}
.vnav button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vnav a.navlink{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);height:32px;padding:0 10px;font-size:13px;color:var(--ink);text-decoration:none}
.vnav a.navlink:hover{border-color:var(--accent);color:var(--accent)}
.pdfbox{display:flex;gap:12px;align-items:center;border:1.5px solid var(--accent);border-radius:var(--r);padding:10px 12px;background:var(--accent-soft);flex-wrap:wrap}
.pdfbox b{font-size:13px;word-break:break-all}
.pdfbtn{flex:none;display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;font-size:14px}
.vnav button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vbody{padding:14px 16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;min-width:0}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:8px 10px}
.note.info{background:var(--accent-soft);color:var(--accent)}
.spec{display:grid;gap:6px}
.spec h3{margin:0;font-size:13px;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:12.5px;min-width:0}
.kv div span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.kv div span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv div.hit{background:var(--warn-soft)}
.kv div.hit span{color:var(--ink);font-weight:500}
.imgs{display:grid;gap:12px}
@media (min-width:1280px){.imgs.two{grid-template-columns:1fr 1fr}}
.pg{display:grid;gap:4px;min-width:0}
.pg .cap{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.pg .cap b{color:var(--ink);font-weight:500}
.pgwrap{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#fff;max-height:none}
.crop{position:relative;overflow:hidden;width:100%;background:#f4f6f7 linear-gradient(90deg,#f4f6f7,#e9edf0,#f4f6f7)}
.crop img{position:absolute;left:0;width:100%;height:auto;max-width:none;display:block}
.crop .hlb{position:absolute;left:0;right:0;background:rgba(255,207,46,.38);border-top:2px solid #e0a800;border-bottom:2px solid #e0a800;pointer-events:none;mix-blend-mode:multiply}
.crop.err::after{content:"그림을 불러오지 못했습니다. 다시 열어 주세요.";position:absolute;inset:0;display:grid;place-items:center;color:#6b7782;font-size:13px}
.zoom .pgwrap{max-height:80vh}
.zoom .crop{width:220%;max-width:none}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
pre.txt{margin:10px 0 0;font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre;overflow-x:auto;background:var(--sunk);border-radius:4px;padding:10px 12px}

/* calculators */
.cpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cpick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px}
.cpick button b{font-size:14px;font-weight:600}
.cpick button span{font-size:12px;color:var(--muted)}
.cpick button.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12.5px;font-weight:500}
.fld input,.fld select{height:40px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:0 10px;min-width:0;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.fld .src{font-size:11.5px;color:var(--muted)}
.fld .src button{border:0;background:none;padding:0;color:var(--accent);font-size:11.5px;text-decoration:underline}
.fld.auto input{border-color:var(--accent)}
.fld.wide{grid-column:1/-1}
.pdfout{margin-top:14px;border:1.5px solid var(--accent);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.pdfout h3{margin:0 0 10px;font-size:14px}
.pdfout .form{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.porow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.pobtn{height:40px;padding:0 18px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer}
.pobtn:disabled{opacity:.6;cursor:wait}
#print-sheet{display:none}
.ps{width:182mm;color:#111;background:#fff;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:10.5pt;line-height:1.5}
.ps .ps-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #0b6b74;padding-bottom:6px;margin-bottom:10px}
.ps .ps-co{font-size:17pt;font-weight:800;color:#0b6b74;letter-spacing:-.02em}
.ps .ps-title{font-size:12pt;font-weight:700;text-align:right}
.ps table{border-collapse:collapse;width:100%;margin:4px 0 10px}
.ps th,.ps td{border:1px solid #c9d2d8;padding:5px 8px;text-align:left;vertical-align:top;font-size:9.5pt}
.ps th{background:#eef4f5;font-weight:700;white-space:nowrap;width:1%}
.ps .ps-meta td{width:34%}
.ps h3{font-size:11pt;margin:12px 0 4px;color:#0b6b74}
.ps .ps-ver{background:#eef4f5;border-radius:4px;padding:8px 10px;font-size:10.5pt}
.ps .ps-step{border:1px solid #c9d2d8;border-radius:4px;padding:6px 10px;margin:0 0 6px;break-inside:avoid}
.ps .ps-step h4{margin:0 0 3px;font-size:10pt;display:flex;justify-content:space-between;gap:8px}
.ps .ps-step h4 span{font-weight:500;color:#555;font-size:9pt;white-space:nowrap}
.ps .ps-eq{font-family:Consolas,"D2Coding",monospace;font-size:9.5pt;margin:1px 0}
.ps .ps-eq i{font-style:normal;color:#666;display:inline-block;width:34px}
.ps .ps-eq.r{font-weight:700}
.ps .ps-foot{margin-top:12px;border-top:1px solid #c9d2d8;padding-top:6px;font-size:8.5pt;color:#555}
.ps .muted{color:#666}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important}
  body>*:not(#print-sheet){display:none!important}
  #print-sheet{display:block!important}
}
.cguide{display:grid;gap:6px;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;margin:2px 0 14px;font-size:13px;line-height:1.5}
.cguide>div{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:baseline}
.cguide span{font-weight:700;color:var(--accent);font-size:12px}
.cguide p{margin:0}
.cguide .cgfoot{display:block;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.fld .conv{font-size:11.5px;color:var(--accent);font-weight:600;min-height:0}
.modal{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.mbox{background:var(--surface);color:var(--ink);border-radius:var(--r);max-width:640px;width:100%;padding:14px 16px;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);min-width:0}
.mbox.wide{max-width:1000px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mx{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
#reply-text{width:100%;box-sizing:border-box;font:inherit;font-size:14px;line-height:1.55;border:1.5px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--sunk);color:var(--ink);resize:vertical}
#cmp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);border-radius:999px;padding:6px 8px 6px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 24px);font-size:13px}
#cmp-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#cmp-bar button{flex:none;height:34px;border-radius:999px;padding:0 14px}
#cmp-bar #cmp-clear{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
th.ck,td.ck{width:38px;text-align:center;padding-left:4px!important;padding-right:4px!important}
td.ck input{width:18px;height:18px;cursor:pointer;margin:0}
.cmpt th,.cmpt td{white-space:nowrap}
.cmpt tbody th{background:var(--sunk);color:var(--ink);font-weight:600;text-align:left}
.dect td.m{white-space:nowrap}
.sbtn,#po-reply,#cmp-reply,#dec-reply{height:40px;padding:0 16px;border:1.5px solid var(--accent);border-radius:var(--r);background:var(--surface);color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
#dec .chip{cursor:pointer}
.modal[hidden],#cmp-bar[hidden],#dec[hidden],#print-sheet[hidden]{display:none!important}
#results>*,#results .ans,#dec>*,#dec .ans{min-width:0;max-width:100%}
.tw{overflow-x:auto;max-width:100%}
body.has-cmp{padding-bottom:72px}
@media (max-width:560px){th.ck,td.ck{width:30px}}
.ftip{display:block;font-size:11.5px;font-weight:600;color:#b45309}
@media (max-width:560px){.cguide>div{grid-template-columns:1fr;gap:0}}

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D = null, S = null, X = [], Z = null, ZC = null, curView = null, lastQ = '', PIDX = {};
const G = 9.80665;
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
const num = v => { const m = String(v ?? '').replace(/,/g,'').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
function fmt(x, sig=3){
  if(!isFinite(x)) return '—';
  const a = Math.abs(x);
  if(a >= 1e7){ const e = Math.floor(Math.log10(a)); const m = x/Math.pow(10,e); return `${m.toFixed(2)}×10<sup>${e}</sup>`; }
  if(a >= 1000) return Math.round(x).toLocaleString('en-US');
  if(a >= 100) return (Math.round(x*10)/10).toLocaleString('en-US');
  if(a === 0) return '0';
  return String(+x.toPrecision(sig+1));
}
const fmtN = x => isFinite(x) ? Math.round(x).toLocaleString('en-US') : '—';
const kgOfN = n => isFinite(n) ? Math.round(n/G).toLocaleString('en-US') : '';
const mm = x => isFinite(x) ? String(+(+x).toFixed(3)) : '—';
const normKey = s => String(s||'').toUpperCase().replace(/[ＸXx×]/g,'×').replace(/\s+/g,'').replace(/[^A-Z0-9/.\-×]/g,'');
const normLoose = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

/* ======================= load ======================= */
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src+' 파일을 찾지 못했습니다')); document.head.appendChild(s); }); }
async function load(){
  try{ await loadScript('data.js'); D = window.BRG_DATA; if(!D) throw new Error('data.js 없음'); }
  catch(e){ $('#dim').innerHTML = `<div class="panel">색인 파일을 불러오지 못했습니다 (${esc(e.message||e)}). 이 파일과 같은 폴더에 data.js · specs.js · pdf 폴더가 있는지 확인하세요.</div>`; return; }
  const cnt = {}; D.pages.forEach(p => { cnt[p.c] = (cnt[p.c]||0)+1; }); D.catCount = cnt;
  D.short.forEach((s,c) => { const o = document.createElement('option'); o.value = c; o.textContent = `${s} (${cnt[c]||0}쪽)`; $('#cat').appendChild(o); });
  D.pages.forEach((p,i) => { PIDX[p.c+'|'+p.p] = i; });
  $('#meta').textContent = `태광베어링 사내용 · ${D.pages.length.toLocaleString()}쪽`;
  const saved = store('brg-cat'); if(saved!=null && saved!=='' && cnt[saved]) $('#cat').value = saved;
  try{ await loadScript('specs.js'); S = window.BRG_SPECS || []; }catch(e){ S = []; }
  try{ await loadScript('xref.js'); X = window.BRG_XREF || []; }catch(e){ X = []; }
  S.forEach((s,i) => { s._i = i; s.z = normKey(s.m); s.zl = normLoose(s.m); s.vz = (s.v||[]).map(normKey); s.ak = s.z.replace(/^HR(\d)/,'$1').replace(/(\d)X?J$/,'$1'); s.g = famGroup(s); });
  X.forEach(r => { r.z = {}; for(const k in r.m) r.z[k] = normLoose(r.m[k]); });
  $('#meta').textContent += ` · 형번 ${S.length.toLocaleString()}개`;
  renderDim(); if(lastQ) run(lastQ);
  const tab = store('brg-tab'); if(tab && tab!=='dim') setTab(tab);
}
function famGroup(s){
  const f = s.fam || '';
  if(/^정밀/.test(f)) return '정밀';
  if(/스러스트/.test(f)) return '스러스트';
  if(/캠팔로워|롤러팔로워/.test(f)) return '캠·롤러팔로워';
  if(/니들|케이지|쉘형|솔리드형|내륜/.test(f)) return '니들';
  if(/유닛|플러머|슬리브|너트|와셔/.test(f)) return '유닛·부속';
  if(/볼/.test(f)) return '볼';
  if(/롤러|롤넥|턱륜/.test(f)) return '롤러';
  return '기타';
}
const GROUPS = ['볼','롤러','니들','스러스트','정밀','캠·롤러팔로워','유닛·부속','기타'];
const MAKERS = ['NSK','NTN','JNS','IKO'];

/* ======================= 치수로 찾기 ======================= */
let DIM = Object.assign({d:'', D:'', B:'', tol:0, g:'', mk:[]}, store('brg-dim')||{});
function parseDim(v){
  v = String(v||'').trim(); if(!v) return NaN;
  // inch: 1-1/4" , 1/2 , 1.25"
  const inch = /"|인치|in$/.test(v) || /\d\/\d/.test(v);
  if(inch){
    v = v.replace(/["인치in\s]/g,'');
    const m = v.match(/^(\d+)?-?(?:(\d+)\/(\d+))?$/);
    if(m && (m[1]||m[2])){ const a = (+m[1]||0) + (m[2] ? m[2]/m[3] : 0); return Math.round(a*25.4*1000)/1000; }
    const f = parseFloat(v); return isFinite(f) ? Math.round(f*25.4*1000)/1000 : NaN;
  }
  return num(v);
}
function dimHits(){
  const d = parseDim(DIM.d), Dd = parseDim(DIM.D), B = parseDim(DIM.B), tol = +DIM.tol||0;
  const has = [isFinite(d), isFinite(Dd), isFinite(B)];
  if(!has.some(Boolean)) return null;
  const ok = (x, t) => isFinite(x) && Math.abs(x - t) <= tol + 1e-6;
  const out = [];
  for(const s of S){
    if(DIM.g && s.g !== DIM.g) continue;
    if(DIM.mk.length && !DIM.mk.includes(s.mk)) continue;
    if(has[0] && !ok(s.d, d)) continue;
    if(has[1] && !ok(s.D, Dd)) continue;
    if(has[2] && !ok(s.B, B)) continue;
    const diff = (has[0]?Math.abs(s.d-d):0) + (has[1]?Math.abs(s.D-Dd):0) + (has[2]?Math.abs(s.B-B):0);
    out.push([diff, s]);
  }
  out.sort((a,b) => a[0]-b[0] || (a[1].d-b[1].d) || (a[1].D-b[1].D) || (a[1].B-b[1].B) || a[1].mk.localeCompare(b[1].mk) || a[1].m.localeCompare(b[1].m,'en',{numeric:true}));
  return {rows: out.map(x=>x[1]), d, D:Dd, B, tol, has};
}
function renderDim(){
  if(!S) return;
  const gcnt = {}; S.forEach(s => gcnt[s.g] = (gcnt[s.g]||0)+1);
  $('#dim').innerHTML = `<div class="panel">
    <div class="dimform">
      <div class="fld"><label for="dm-d">내경 d (mm)</label><input id="dm-d" data-dim="d" inputmode="decimal" autocomplete="off" value="${esc(DIM.d)}" placeholder="예: 25"></div>
      <div class="fld"><label for="dm-D">외경 D (mm)</label><input id="dm-D" data-dim="D" inputmode="decimal" autocomplete="off" value="${esc(DIM.D)}" placeholder="예: 52"></div>
      <div class="fld"><label for="dm-B">폭 B (mm)</label><input id="dm-B" data-dim="B" inputmode="decimal" autocomplete="off" value="${esc(DIM.B)}" placeholder="예: 15"></div>
      <div class="fld tol"><label for="dm-tol">허용 차이</label><select id="dm-tol" data-dim="tol">${[[0,'정확히 일치'],[0.5,'± 0.5 mm'],[1,'± 1 mm'],[2,'± 2 mm'],[5,'± 5 mm']].map(([v,l])=>`<option value="${v}" ${+DIM.tol===v?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div style="margin-top:12px;display:grid;gap:8px">
      <div class="fchips">${[''].concat(GROUPS).filter(g=>!g||gcnt[g]).map(g=>`<span class="fchip ${DIM.g===g?'on':''}" data-dg="${esc(g)}">${g||'전체 형식'}${g?`<span class="n">${gcnt[g]}</span>`:''}</span>`).join('')}</div>
      <div class="fchips">${MAKERS.map(m=>`<span class="fchip ${DIM.mk.includes(m)?'on':''}" data-dm="${m}">${m}</span>`).join('')}<span class="hint" style="align-self:center">메이커를 고르지 않으면 전체</span></div>
    </div>
    <p class="hint" style="margin:10px 0 0">아는 치수만 넣으면 됩니다 (예: 내경·외경만). 니들베어링(내륜 없음)은 내경 칸에 <b>축 지름(Fw)</b>을 넣으세요. 인치는 <span class="mono">1-1/4"</span>처럼 쓰면 mm로 바꿔 찾습니다. 테이퍼롤러의 폭은 <b>조립폭 T</b>로 찾습니다.</p>
  </div><div id="dim-out"></div>`;
  dimOut();
}
function dimOut(){
  const o = $('#dim-out'); if(!o) return;
  const r = dimHits();
  if(!r){
    o.innerHTML = `<div class="empty"><div><div class="sec-h"><span>자주 찾는 예</span></div><div class="chips">${[['25','52','15'],['40','80','18'],['50','90',''],['20','','16'],['30','62','16'],['100','','']].map(([a,b,c])=>`<button class="chip mono" data-dex='${JSON.stringify([a,b,c])}'>${[a&&('d'+a),b&&('D'+b),c&&('B'+c)].filter(Boolean).join(' · ')}</button>`).join('')}</div></div>
      <div class="panel"><h2>수록 형번</h2><div class="catlist">${D.short.map((s,c)=>{const n=S.filter(x=>x.c===c).length; return n?`<button data-open="${c}"><span>${esc(s)}</span><span>${n.toLocaleString()}개</span></button>`:''}).join('')}</div></div></div>`;
    return;
  }
  const rows = r.rows;
  if(!rows.length){ o.innerHTML = `<div class="panel"><p class="hint" style="margin:0">조건에 맞는 형번이 없습니다. 허용 차이를 「± 1 mm」 이상으로 넓히거나, 치수 하나를 비워 보세요.</p></div>`; return; }
  const exact = x => isFinite(x);
  const show = rows.slice(0, 300);

const SYN = {

  '정격하중':['정격하중','LOAD RATING'],'끼워맞춤':['끼워맞춤','FIT'],'공차':['공차','치수차','TOLERANCE'],'클리어런스':['클리어런스','틈새','CLEARANCE'],'예압':['예압','PRELOAD'],
  '캠팔로워':['캠팔로워','캠 팔로우어','CAM FOLLOWER'],'니들':['니들','니이들','NEEDLE'],'테이퍼':['테이퍼','TAPERED'],'구면':['자동조심','SPHERICAL'],'앵귤러':['앵귤러','ANGULAR']

function parse(q){

  toks.forEach((t,k) => {
    if(/\d/.test(t) && /^[A-Z0-9][A-Z0-9/.\-×*]{2,}$/i.test(t) && !/^\d{1,3}(\.\d+)?$/.test(t)) models.push({full: normKey(t), raw: t});

}
function variants(t){ const v = new Set([t.replace(/\s+/g,'').toUpperCase()]); for(const k in SYN) if(t.includes(k)) SYN[k].forEach(x => v.add(x.replace(/\s+/g,'').toUpperCase())); return [...v].filter(Boolean); }

  if(!hits.length){

    for(let L = full.length-1; L >= 3 && !hits.length; L--){
      const p = full.slice(0, L);

  if(!hits.length && full.length>=3) hits = S.filter(s => inScope(s) && (s.z.startsWith(full) || s.ak.startsWith(full))).slice(0, 80);
  const rank = s => (s.z===full || s.vz.includes(full)) ? 0 : 1;
  hits.sort((a,b) => rank(a)-rank(b) || a.c-b.c || a.z.length-b.z.length || a.i-b.i);

}
const COLS = [

function prep(){ if(Z) return; Z = D.pages.map(p => p.t.replace(/\s+/g,'').toUpperCase()); ZC = D.pages.map(p => (p.k||'').replace(/\s+/g,'').toUpperCase()); }

function count(s, v){ if(!v) return 0; let c=0, k=s.indexOf(v); while(k>=0 && c<50){ c++; k=s.indexOf(v,k+v.length); } return c; }

let renderSeq = 0;
async function drawPage(i, host, boxes, zoomed){

  }

function needleDecode(m){

  if((r = s.match(/^NKS?(\d+)\/(\d+)/))) return R('solid',+r[1],null,+r[2]);
  if((r = s.match(/^(R?)NA(49|59|69|48)(?:\/(\d+)|(\d{2}))/))){ const code = r[3] ? +r[3] : ({'00':10,'01':12,'02':15,'03':17}[r[4]] || +r[4]*5); return r[1] ? {typ:'solid',il:'Fw',in:null,out:null,w:null,series:r[2],bore:code} : {typ:'solid-ir',il:'d',in:code,out:null,w:null,series:r[2]}; }

  if((r = s.match(/^LM(\d{2,3})(\d{2})(?!\d)/))) return R('solid-ir',+r[1],null,+r[2],'d');
  if((r = s.match(/^(R?)NAFW?(\d{2,3})(\d{2,3})(\d{2})(?!\d)/)) && +r[2] < +r[3]) return R(r[1]?'solid':'solid-ir',+r[2],+r[3],+r[4],r[1]?'Fw':'d');

  if((r = s.match(/^(?:IR|LRT|LR)(\d+(?:\.\d+)?)×(\d+(?:\.\d+)?)×(\d+(?:\.\d+)?)/))) return R('ir',+r[1],+r[2],+r[3],'d');

}

  if(t.matches('tr.r')){ if(t.dataset.xr!=null){ const r = X[+t.dataset.xr]; openPage(r.i, null, r); return; } const s = S[+t.dataset.s]; openPage(s.i, s); return; }
  if(t.dataset.mclose){ t.closest('.modal').hidden = true; return; }
  if(t.id==='help-btn'){ openHelp(); return; }
  if(t.dataset.dex){ const [a,b,c] = JSON.parse(t.dataset.dex); DIM.d=a; DIM.D=b; DIM.B=c; store('brg-dim', DIM); renderDim(); return; }
  if(t.dataset.q){ setTab('search'); $('#q').value = t.dataset.q; run(t.dataset.q); window.scrollTo({top:0}); return; }
  if(t.dataset.nxq){ NXQ = t.dataset.nxq; store('brg-nxq', NXQ); setTab('nx'); renderNx(); return; }
  if(t.dataset.i){ openPage(+t.dataset.i); return; }
  if(t.dataset.open!==undefined){ const c = +t.dataset.open; const i = D.pages.findIndex(p => p.c===c); if(i>=0) openPage(i); return; }
  if(t.dataset.go!==undefined && t.dataset.go!==''){ openPage(+t.dataset.go); return; }
  if(t.dataset.reply){ showReply(specReplyText(S[+t.dataset.reply]), '회신 문구 (근거 페이지)'); return; }
  if(t.dataset.cmpadd){ const i = +t.dataset.cmpadd; if(!CMP.includes(i)){ if(CMP.length>=4){ alertBar('비교표는 최대 4개까지 넣을 수 있습니다.'); return; } CMP.push(i); } document.querySelectorAll(`input[data-cmp="${i}"]`).forEach(c => c.checked = true); cmpBar(); t.textContent = '비교표에 넣음 ✓'; return; }
  if(t.dataset.calc){ openCalc(t.dataset.calc, +t.dataset.si); return; }
  if(t.dataset.cp){ const keep = calcState.vals.model, sp = calcState.spec; calcState.id = t.dataset.cp; calcState.vals = {}; calcState.src = {}; calcState.spec = null; if(keep){ calcState.vals.model = keep; if(sp) fillFromSpec(sp); } renderCalc(); return; }
  if(t.dataset.ref){ const [c,l] = REFP()[t.dataset.ref]; const i = pageByLabel(c,l); if(i>=0) openPage(i); return; }
  if(t.dataset.srow && calcState.spec){ openPage(calcState.spec.i, calcState.spec); return; }
  if(t.id==='savepg'){ savePage(+t.dataset.pg, t); return; }
  switch(t.id){
    case 'vback': closeView(); break;
    case 'zoomb': { const on = !store('brg-zoom'); store('brg-zoom', on); if(curView!=null) openPage(curView, viewSpec); break; }
    case 'cmp-open': openCmp(); break;
    case 'cmp-clear': CMP.length = 0; document.querySelectorAll('input[data-cmp]').forEach(c => c.checked = false); cmpBar(); break;
    case 'cmp-pdf': exportPdf(cmpSheet(), cmpName(), $('#cmp-msg'), t); break;
    case 'cmp-xlsx': cmpXlsx(); break;
    case 'cmp-reply': showReply(cmpReplyText(), '회신 문구 (비교표)'); break;
    case 'reply-copy': copyReply(); break;
    case 'po-btn': { const c = CALCS[calcState.id]; exportPdf(calcSheet(), [c.title.replace(/\s/g,''), safeName(calcState.spec?calcState.spec.m:calcState.vals.model), safeName(PO.cust), today('')].filter(Boolean).join('_'), $('#po-msg'), t); break; }
    case 'po-reply': showReply(calcReplyText(), '회신 문구 (계산 결과)'); break;
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape'){ document.querySelectorAll('.modal').forEach(m => m.hidden = true); } });
$('#calc').addEventListener('input', e => {
  const f = e.target.dataset.f; if(!f) return;
  if(f==='model'){ calcState.vals.model = e.target.value; clearTimeout(ctmr); ctmr = setTimeout(() => { const c = specsByModel(e.target.value); const keep = {...calcState.vals}; fillFromSpec(c[0]||null); if(!c[0]) calcState.vals = keep; renderCalc(); const el = $('#cf-model'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 450); return; }
  if(f==='row') return;
  calcState.vals[f] = e.target.value;
  if(e.target.tagName==='SELECT'){ renderCalc(); return; }
  if(calcState.src[f]){ delete calcState.src[f]; e.target.closest('.fld').classList.remove('auto'); const sEl = e.target.parentNode.querySelector('.src'); if(sEl) sEl.textContent = '직접 입력 (표 값을 바꿈)'; }
  computeCalc();
});
$('#calc').addEventListener('change', e => { if(e.target.dataset.f==='row'){ fillFromSpec(S[+e.target.value]); renderCalc(); } });
document.addEventListener('keydown', e => {
  if(curView==null || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(document.querySelector('.modal:not([hidden])')) return;
  if(e.key==='Escape'){ closeView(); return; }
  const nb = neighbors(curView);
  if(e.key==='ArrowLeft' && nb.prev!=null) openPage(nb.prev);
  if(e.key==='ArrowRight' && nb.next!=null) openPage(nb.next);
});
addEventListener('resize', () => { if(curView!=null) document.body.classList.toggle('viewing', matchMedia('(max-width:979px)').matches); });
/* ===== 접근 비밀번호 (THK 카탈로그 검색과 같은 비밀번호) ===== */
const PW_HASH = 'cb7593a6adb4b6339f9b0d794acc8903819db9e7c57624a3f0961d085b231999';
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function authed(){ try{ if(sessionStorage.getItem('brg_auth')==='1' || sessionStorage.getItem('thk_auth')==='1') return true; const t = +localStorage.getItem('brg_auth_t'); return t>0 && Date.now()-t < 30*864e5; }catch(e){ return false; } }
function openGate(){ const g = $('#gate'); if(g) g.remove(); load(); }
window.__brg = {get D(){return D}, get S(){return S}, get X(){return X}, needleDecode, nxHtml, dimHits, specHits, parseDim};
if(authed()) openGate();
else {
  setTimeout(() => { const i = $('#gate-pw'); if(i) i.focus(); }, 50);
  $('#gate-f').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('#gate-pw').value.trim();
    if(await sha256(v) === PW_HASH){ try{ sessionStorage.setItem('brg_auth','1'); localStorage.setItem('brg_auth_t', String(Date.now())); }catch(_){} openGate(); }
    else { $('#gate-err').textContent = '비밀번호가 틀렸습니다.'; $('#gate-pw').select(); }
  });
}
})();
</script>
